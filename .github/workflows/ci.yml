name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Tests con cobertura
        run: npm run test:cobertura
      - name: Ejemplo del README
        run: npm run ejemplo
      - name: dist/ coincide con el build
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ no coincide con src/. Corré npm run build y commiteá dist/."
            exit 1
          fi
