name: Error
description: El core no hace lo que promete (la API, la documentación o los mensajes).
labels: [triage, error]
body:
  - type: markdown
    attributes:
      value: |
        Si "no anda" quiere decir "no hace lo que mi app necesita", es un **Pedido**, no un error.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Lo mínimo que lo muestra, idealmente una definición chica, un registro de juguete y la llamada. Sin datos ni nombres de tu app.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: El tag de ts-workflow-core, y Node o el navegador.
    validations:
      required: true
